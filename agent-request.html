<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request an agent</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="min-h-screen bg-orange-50 text-gray-800">
    <nav class="flex flex-wrap items-center gap-6 border-b border-orange-400 bg-orange-300 p-5 text-lg font-semibold">
        <a class="hover:text-orange-900" href="index.html">home</a>
        <a class="hover:text-orange-900" href="about.html">about</a>
        <a class="hover:text-orange-900" href="contacts.html">contacts</a>
        <button id="signOutButton" class="rounded border border-orange-700 bg-orange-400 px-4 py-2 text-sm hover:bg-orange-500" type="button">log out</button>
    </nav>
    <main class="mx-auto w-full max-w-3xl px-5 py-12">
        <section class="rounded-lg border border-orange-400 bg-white p-8 shadow-lg">
            <p id="userGreeting" class="text-sm font-semibold uppercase tracking-widest text-orange-700"></p>
            <h1 class="mt-2 text-3xl font-bold text-orange-900">Find an agent</h1>
            <p class="mt-2 text-gray-600">Tell us what service you need and where.</p>
            <form id="agentRequestForm" class="mt-6">
                <label class="font-semibold" for="requestService">Service needed</label>
                <select class="mt-2 w-full rounded border border-gray-300 bg-white p-3" id="requestService" required>
                    <option value="house hunting">House hunting</option>
                    <option value="land surveying">Land surveying</option>
                    <option value="property valuation">Property valuation</option>
                </select>
                <label class="mt-4 block font-semibold" for="requestLocation">Your location</label>
                <input class="mt-2 w-full rounded border border-gray-300 p-3" id="requestLocation" required>
                <label class="mt-4 block font-semibold" for="requestDetails">More information</label>
                <textarea class="mt-2 w-full rounded border border-gray-300 p-3" id="requestDetails" rows="4" placeholder="Describe what you need"></textarea>
                <p id="requestMessage" class="mt-4 min-h-6 text-sm" role="status"></p>
                <button class="mt-2 rounded bg-orange-500 px-5 py-3 font-semibold text-white hover:bg-orange-600" type="submit">Request an agent</button>
            </form>
        </section>
        <section class="mt-8 rounded-lg border border-orange-200 bg-white p-8 shadow-md">
            <h2 class="text-2xl font-bold text-orange-900">Your requests</h2>
            <div id="requestList" class="mt-4 space-y-3"></div>
        </section>
    </main>
    <script type="module" src="./js%20files/app.js"></script>
</body>
</html>
