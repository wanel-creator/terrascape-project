    <body class="min-h-screen bg-orange-50 p-5 text-gray-800">
    
                <nav class="flex flex-wrap items-center gap-6 border border-orange-400 bg-orange-300 p-5 text-lg font-bold md:gap-10">
            <a class="hover:text-orange-900" href="index.html">home</a>
            <a class="hover:text-orange-900" href="about.html">about</a>
            <a class="hover:text-orange-900" href="contacts.html">contacts</a>
            <button id="openMoreButton" class="rounded px-4 py-2 hover:bg-orange-400 hover:text-orange-900" type="button" aria-haspopup="dialog" aria-controls="moreOverlay">more</button>
            <a class="rounded border border-orange-700 bg-orange-400 px-4 py-2 text-base hover:bg-orange-500" href="loginform.html">log in</a>
            <a class="rounded border border-orange-700 bg-orange-400 px-4 py-2 text-base hover:bg-orange-500" href="registrationform.html">register</a>
        </nav>
        <main class="mx-auto mt-8 max-w-3xl px-5 pb-12">
            <section class="rounded border border-orange-400 bg-white p-6 shadow-md">
                <h1 class="text-3xl font-bold text-orange-900">Get in touch</h1>
                <p class="mt-3 text-gray-600">
                    Contact us for house hunting, land surveying, or property valuation services.
                </p>

                <div class="mt-6 space-y-3 text-gray-800">
                    <p><strong>Email:</strong> <a class="text-orange-700 hover:text-orange-900" href="mailto:terrascope@gmail.com">terrascope@gmail.com</a></p>
                    <p><strong>WhatsApp:</strong> <a class="text-orange-700 hover:text-orange-900" href="https://wa.me/254791900858">0791 900 858</a></p>
                    <p><strong>Service hours:</strong> Monday to Saturday, 8:00 AM to 6:00 PM</p>
                </div>

                <form id="contactForm" class="mt-8 space-y-4">
                    <h2 class="text-xl font-bold text-orange-900">Send us a message</h2><br>
                    <label class="block font-semibold" for="contactName">Full name</label>
                    <input class="w-full rounded border border-orange-300 p-3" type="text" id="contactName" name="name" required><br><br>
                    <label class="block font-semibold" for="contactEmail">Email address</label>
                    <input class="w-full rounded border border-orange-300 p-3" type="email" id="contactEmail" name="email" required><br><br>
                    <label class="block font-semibold" for="contactMessage">Message</label>
                    <textarea class="w-full rounded border border-orange-300 p-3" id="contactMessage" name="message" rows="5" required></textarea><br><br>
                    <button class="rounded bg-orange-500 px-5 py-3 font-semibold text-white hover:bg-orange-600" type="submit">Send message</button>
                    <p id="contactStatus" class="mt-4 text-sm" role="status" aria-live="polite"></p>
                </form>
            </section>
        </main>
        <script src="./contact.js"></script>
    </body>
</html>
