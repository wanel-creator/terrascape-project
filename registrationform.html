<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Create an account</title>
        <link rel="stylesheet" href="./src/output.css">
    </head>
    <body class="min-h-screen bg-orange-50 p-5 text-gray-800">
                <nav class="flex flex-wrap items-center gap-6 border border-orange-400 bg-orange-300 p-5 text-lg font-bold md:gap-10">
            <a class="hover:text-orange-900" href="index.html">home</a>
            <a class="hover:text-orange-900" href="about.html">about</a>
            <a class="hover:text-orange-900" href="contacts.html">contacts</a>
            <a class="rounded border border-orange-700 bg-orange-400 px-4 py-2 text-base hover:bg-orange-500" href="loginform.html">log in</a>
            <a class="rounded border border-orange-700 bg-orange-400 px-4 py-2 text-base hover:bg-orange-500" href="registrationform.html">register</a>
        </nav>
        <main class="mx-auto flex w-full max-w-md items-center px-5 py-12">
            <form id="registrationForm" class="w-full rounded-lg border border-orange-400 bg-white p-8 shadow-lg">
                <h1 class="text-3xl font-bold text-orange-900">Create your account</h1>
                    <p class="mt-2 text-gray-600">Register to book and manage services.</p>
                <div class="mt-6">
                    <label class="font-semibold" for="fullName">Full name</label>
                    <input class="mt-2 w-full rounded border border-gray-300 p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" type="text" id="fullName" autocomplete="name" required>
                </div>
                <div class="mt-4">
                    <label class="font-semibold" for="registerEmail">Email address</label>
                    <input class="mt-2 w-full rounded border border-gray-300 p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" type="email" id="registerEmail" autocomplete="email" required>
                </div>
                <div class="mt-4">
                    <label class="font-semibold" for="phone">Phone number</label>
                    <input class="mt-2 w-full rounded border border-gray-300 p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" type="tel" id="phone" autocomplete="tel" required>
                </div>
                <div class="mt-4">
                    <label class="font-semibold" for="registerRole">I am a</label>
                    <select class="mt-2 w-full rounded border border-gray-300 bg-white p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" id="registerRole" required>
                        <option value="user">User looking for a service</option>
                        <option value="agent">Service agent</option>
                    </select>
                </div>
                <div id="agentFields" class="mt-4" hidden>
                    <label class="font-semibold" for="agentService">Service you provide</label>
                    <select class="mt-2 w-full rounded border border-gray-300 bg-white p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" id="agentService">
                        <option value="house hunting">House hunting</option>
                        <option value="land surveying">Land surveying</option>
                        <option value="property valuation">Property valuation</option>
                    </select>
                    <label class="mt-4 block font-semibold" for="agentLocation">Service location</label>
                    <input class="mt-2 w-full rounded border border-gray-300 p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" type="text" id="agentLocation">
                    <label class="mt-4 block font-semibold" for="agentBio">Short professional description</label>
                    <textarea class="mt-2 w-full rounded border border-gray-300 p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" id="agentBio" rows="3"></textarea>
                </div>
                <div class="mt-4">
                    <label class="font-semibold" for="registerPassword">Password</label>
                    <input class="mt-2 w-full rounded border border-gray-300 p-3 focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" type="password" id="registerPassword" autocomplete="new-password" minlength="6" required>
                </div>
                <p id="registrationMessage" class="mt-4 min-h-6 text-sm" role="status"></p>
                <button class="mt-2 w-full rounded bg-orange-500 px-5 py-3 font-semibold text-white hover:bg-orange-600 disabled:cursor-not-allowed disabled:opacity-60" type="submit">Create account</button>
                <div id="verificationStep" class="mt-5 border-t border-orange-100 pt-5" hidden>
                    <div id="verificationForm">
                        <p class="mb-3 text-sm text-gray-600">After registration, Supabase will email you a confirmation code.</p>
                        <label class="font-semibold" for="verificationCode">Confirmation code</label>
                        <input class="mt-2 w-full rounded border border-gray-300 p-3 tracking-[0.35em] focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200" type="text" id="verificationCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" disabled>
                        <button class="mt-3 w-full rounded border border-orange-500 px-5 py-3 font-semibold text-orange-700 hover:bg-orange-50 disabled:opacity-60" type="button">Confirm email</button>
                        <button id="resendCodeButton" class="mt-3 w-full text-sm font-semibold text-orange-700 underline hover:text-orange-900" type="button">Resend code</button>
                    </div>
                </div>
                <p class="mt-5 text-center text-sm text-gray-600">Already registered? <a class="font-semibold text-orange-700 hover:text-orange-900" href="loginform.html">Log in</a></p>
            </form>
        </main>
        <script type="module" src="./auth.js"></script>
    </body>
</html>
